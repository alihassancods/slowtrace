[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These files are Semgrep fixtures: scanned as text, never imported or executed.
# Their undefined model/cursor names (Order, User, cursor, …) are the point.
"tests/semgrep_test_cases/*" = ["F821"]
